<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111318" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Formommy" />
  <title>Formommy — Russian A2</title>
  <link rel="manifest" href="manifest.webmanifest?v=4" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css?v=4" />
  <link rel="stylesheet" href="stage2.css?v=4" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button id="backButton" class="icon-button hidden" aria-label="Go back">←</button>
      <div class="brand" id="brandButton" role="button" tabindex="0">
        <span class="brand-mark">Ф</span>
        <span>Formommy</span>
      </div>
      <div class="streak" title="Daily streak">🔥 <span id="streakCount">1</span></div>
    </header>

    <main id="app" aria-live="polite"></main>

    <nav id="bottomNav" class="bottom-nav hidden" aria-label="Primary navigation">
      <button data-nav="home" class="nav-item active"><span>⌂</span><small>Home</small></button>
      <button data-nav="course" class="nav-item"><span>◫</span><small>Course</small></button>
      <button data-nav="review" class="nav-item"><span>↻</span><small>Review</small></button>
      <button data-nav="tutor" class="nav-item"><span>✦</span><small>Practice</small></button>
    </nav>
  </div>

  <script src="app.js?v=4"></script>
</body>
</html>
