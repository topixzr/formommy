<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4eee8" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171817" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Formommy" />
  <meta name="description" content="A mobile-first adaptive Russian A1 to A2 course built around practical everyday couple life." />
  <title>Formommy — Russian for Us</title>
  <link rel="manifest" href="manifest.webmanifest?v=18" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css?v=18" />
  <link rel="stylesheet" href="module-ui.css?v=18" />
  <link rel="stylesheet" href="advanced-ui.css?v=18" />
  <link rel="stylesheet" href="ai-help.css?v=18" />
  <link rel="stylesheet" href="navigation-ui.css?v=18" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button id="backButton" class="icon-button hidden" aria-label="Go back">←</button>
      <div class="brand" id="brandButton" role="button" tabindex="0" aria-label="Go home"><span class="brand-mark">Ф</span><span>Formommy</span></div>
      <div class="streak" title="Daily streak" aria-label="Daily streak">🔥 <span id="streakCount">1</span></div>
    </header>
    <main id="app" aria-live="polite"></main>
    <nav id="bottomNav" class="bottom-nav hidden" aria-label="Primary navigation">
      <button data-nav="home" class="nav-item active"><span aria-hidden="true">⌂</span><small>Home</small></button>
      <button data-nav="course" class="nav-item"><span aria-hidden="true">▦</span><small>Learn</small></button>
      <button data-nav="practice" class="nav-item"><span aria-hidden="true">✦</span><small>Practice</small></button>
      <button data-nav="profile" class="nav-item"><span aria-hidden="true">○</span><small>Profile</small></button>
    </nav>
  </div>
  <script src="course-data.js?v=18"></script>
  <script src="course-pack-2.js?v=18"></script>
  <script src="preflight-migration.js?v=18"></script>
  <script src="app.js?v=18"></script>
  <script src="module-ui.js?v=18"></script>
  <script src="module-pack-2.js?v=18"></script>
  <script src="learning-intelligence.js?v=18"></script>
  <script src="quick-practice.js?v=18"></script>
  <script src="practice-lab.js?v=18"></script>
  <script src="milestones.js?v=18"></script>
  <script src="ai-help.js?v=18"></script>
  <script src="navigation-ui.js?v=18"></script>
  <script>
    if (state.onboarded) window.navigate('home');
    if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  </script>
</body>
</html>
